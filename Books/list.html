<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIMPUS-Mini | Daftar Buku</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header>
    <h1>SIMPUS-Mini</h1>
    <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
    <nav>
      <ul>
        <li><a href="../index.html">Beranda</a></li>
        <li><a href="../Books/list.html">Daftar Buku</a></li>
        <li><a href="../Books/tambah.html">Tambah Buku</a></li>
        <li><a href="../Members/list.html">Daftar Anggota</a></li>
        <li><a href="../Members/tambah.html">Tambah Anggota</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section>
      <h2>Daftar Buku</h2>
      <div class="search-box">
        <label for="search-input">Cari Judul Buku</label>
        <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.35rem;">
          <input type="text" id="search-input" placeholder="Ketik judul buku..." style="flex: 1;">
          <button type="button" id="btn-reload" class="btn-reload">Muat Ulang</button>
        </div>
        <p id="result-counter"></p>
      </div>
      <p id="loading-indicator" style="display:none;">Memuat data...</p>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Judul</th>
              <th>Pengarang</th>
              <th>Tahun</th>
              <th>Kategori</th>
              <th>Stok</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody>
            <!-- Baris diisi secara dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <footer>
    <p>© 2026 SIMPUS-Mini — Jobsheet 1</p>
  </footer>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/buku.js"></script>
</body>
</html>
